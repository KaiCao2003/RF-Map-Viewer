name: Build Apple silicon distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-python-runtime.txt
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-python-runtime.txt
      - name: Run model tests
        run: python -m unittest discover -s tests -p "test_rfmapping_gui.py"
      - name: Run Tk integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk python3-venv xvfb
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/tk-test-venv"
          "$RUNNER_TEMP/tk-test-venv/bin/python" -m pip install --disable-pip-version-check --requirement requirements-python-runtime.txt
          xvfb-run --auto-servernum "$RUNNER_TEMP/tk-test-venv/bin/python" -m unittest discover -s tests -p "test_rfmapping_gui_tk.py"
      - name: Validate synthetic demo
        run: python rfmapping_gui.py --self-test data/demo_rf_map.json

  build-swift-macos:
    name: Build Swift macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run Swift tests
        run: swift test -c release
      - name: Build arm64 application
        run: script/build_macos_app.sh
      - name: Inspect application architecture
        run: |
          test "$(lipo -archs 'dist/RF Map Viewer.app/Contents/MacOS/RFMappingSwiftUI')" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/RF Map Viewer.app/Contents/Info.plist')" = "2.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' 'dist/RF Map Viewer.app/Contents/Info.plist')" = "15.0"
      - uses: actions/upload-artifact@v6
        with:
          name: swift-macos-arm64
          path: dist/RF_Map_Viewer-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  build-python-macos:
    name: Build Python macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-python-runtime.txt
      - name: Verify Apple silicon Python and install runtime dependencies
        run: |
          python -c 'import platform, tkinter; assert platform.machine() == "arm64"; print(platform.platform(), tkinter.TkVersion)'
          python -m pip install --disable-pip-version-check --requirement requirements-python-runtime.txt
      - name: Run Python model tests
        run: python -m unittest discover -s tests -p "test_rfmapping_gui.py"
      - name: Build arm64 application
        run: script/build_python_macos_app.sh
      - name: Inspect archive
        run: |
          unzip -tq dist/python/RF_Map_Viewer-python-macos-arm64.zip
          test "$(unzip -p dist/python/RF_Map_Viewer-python-macos-arm64.zip 'RF Map Viewer.app/Contents/Info.plist' | plutil -extract CFBundleShortVersionString raw -o - -)" = "1.8.0"
          test "$(unzip -p dist/python/RF_Map_Viewer-python-macos-arm64.zip 'RF Map Viewer.app/Contents/Info.plist' | plutil -extract LSMinimumSystemVersion raw -o - -)" = "14.0"
          if unzip -Z1 dist/python/RF_Map_Viewer-python-macos-arm64.zip | grep -Eq '(^|/)__MACOSX/|(^|/)\._'; then
            echo "Archive contains AppleDouble metadata" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: python-macos-arm64
          path: dist/python/RF_Map_Viewer-python-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-python
      - build-swift-macos
      - build-python-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum \
            RF_Map_Viewer-macos-arm64.zip \
            RF_Map_Viewer-python-macos-arm64.zip \
            > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "RF Map Viewer $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
