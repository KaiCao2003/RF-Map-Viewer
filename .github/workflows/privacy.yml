name: Repository privacy

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s script/tests -p test_repository_privacy.py
      - run: python script/check_repository_privacy.py --history HEAD
