# Include this file inside the existing hhw9l84 server block. It intentionally
# owns only /rfmapping and /rfmapping/*; the existing root /api/ route is not
# changed or shadowed.

location = /rfmapping {
    allow 127.0.0.1/32;
    allow ::1/128;
    allow fe80::/10;
    allow 165.124.111.0/24;
    allow 10.103.68.0/24;
    allow 172.28.0.0/16;
    deny all;

    return 308 /rfmapping/;
}

location ^~ /rfmapping/ {
    allow 127.0.0.1/32;
    allow ::1/128;
    allow fe80::/10;
    allow 165.124.111.0/24;
    allow 10.103.68.0/24;
    allow 172.28.0.0/16;
    deny all;

    # The trailing slash strips /rfmapping/ before forwarding. Therefore
    # /rfmapping/api/health reaches the app as /api/health, without claiming
    # the server's existing /api/ location.
    proxy_pass http://127.0.0.1:3005/;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 5s;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /rfmapping;
}
